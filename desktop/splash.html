<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      html, body {
        margin: 0; height: 100%;
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #1d306e, #2347d6);
        color: #fff;
        display: flex; align-items: center; justify-content: center;
        user-select: none;
      }
      .box { text-align: center; }
      .title { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
      .sub { font-size: 13px; opacity: 0.8; margin-top: 6px; }
      .spinner {
        margin: 22px auto 0;
        width: 34px; height: 34px;
        border: 3px solid rgba(255,255,255,0.25);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="title">EduGestão</div>
      <div class="sub">Iniciando o servidor interno…</div>
      <div class="spinner"></div>
    </div>
  </body>
</html>
