name: Build Desktop (Windows .exe)

# Gera o instalador do Windows automaticamente.
# - Roda a cada tag "v*" (ex.: v1.0.0) e também sob demanda (workflow_dispatch).
# - O instalador fica disponível em "Artifacts" da execução e, para tags,
#   também é anexado a um Release do GitHub.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Build do frontend (gera client/dist, empacotado no app)
      - name: Build do frontend
        working-directory: client
        run: |
          npm ci
          npm run build

      # 2) Dependências de produção do backend (ficam dentro do app)
      - name: Instalar backend (produção)
        working-directory: server
        run: npm ci --omit=dev

      # 3) Dependências do desktop
      - name: Instalar desktop
        working-directory: desktop
        run: npm ci

      # 4) Recompila módulos nativos do backend (better-sqlite3) para o ABI do
      #    Electron, pois o backend roda via ELECTRON_RUN_AS_NODE.
      - name: Recompilar módulos nativos para o Electron
        working-directory: desktop
        run: npx electron-rebuild -m ../server

      # 5) Empacota o instalador (NSIS) + versão portátil.
      #    --publish never: o electron-builder apenas gera os arquivos; a
      #    publicação no Release é feita no passo 6 (action-gh-release).
      - name: Gerar instalador Windows
        working-directory: desktop
        run: npx electron-builder --win --x64 --publish never

      - name: Publicar artefatos (instalador)
        uses: actions/upload-artifact@v4
        with:
          name: simula-escola-ia-windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error

      # 6) Para tags v*, cria um Release e anexa os instaladores
      - name: Anexar ao Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
