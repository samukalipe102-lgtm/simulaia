name: CI

# Roda os testes automaticamente a cada push e pull request.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — testes unit/integração + e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Preparar ambiente de teste
        run: cp .env.example .env

      - name: Testes unit/integração
        run: npm test

      - name: Testes end-to-end (API real, sem Gmail real)
        run: npm run test:e2e

  frontend-build:
    name: Frontend — build de produção
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build
